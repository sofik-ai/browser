<!doctype html>
<!-- Driven by `sofik_engine_host --dialog-test --upload=FILE`: the host clicks
     at (100, 40), which opens the chooser, and later calls report(). -->
<meta charset="utf-8">
<title>upload test</title>
<body style="margin:0">
<input id="f" type="file" accept=".txt,image/*"
       style="position:absolute;left:20px;top:20px;width:300px;height:40px">
<script>
let picked = null;
f.addEventListener("change", async () => {
  const file = f.files[0];
  picked = {name: file.name, size: file.size, text: await file.text()};
});
function report() { return JSON.stringify({picked}); }
</script>
